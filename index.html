<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main-container">
        <div id="left-section">
            <div id="currency-section">
                <h3 id="first-currency">1 TRY eşittir</h3>
                <h1 id="second-currency" aria-live="polite">—</h1>
                <p id="date"><span id="now"></span> · Frankfurter referans kuru</p>
                <p id="rate-status" role="status"></p>
                <button id="retry-rate" type="button" class="utility-btn" hidden>Yeniden dene</button>
            </div>
            <div id="currency-inputs">
                <div class="currency-field">
                    <input type="number" id="first-currency-number" aria-label="Kaynak tutar" aria-describedby="amount-error" min="0" step="any" value="1">
                    <select id="first-currency-option" aria-label="Kaynak para birimi">
                        <option value="EUR">EUR</option>
                        <option value="TRY" selected>TRY</option>
                        <option value="USD">USD</option>
                        <option value="GBP">GBP</option>
                        <option value="JPY">JPY</option>
                        <option value="CAD">CAD</option>
                        <option value="AUD">AUD</option>
                    </select>
                </div>
                <button id="swap-currencies" type="button" class="utility-btn">Para birimlerini değiştir</button>
                <div class="currency-field">
                    <input type="number" id="second-currency-number" aria-label="Çevrilen tutar" readonly>
                    <select id="second-currency-option" aria-label="Hedef para birimi">
                        <option value="EUR">EUR</option>
                        <option value="TRY">TRY</option>
                        <option value="USD" selected>USD</option>
                        <option value="GBP">GBP</option>
                        <option value="JPY">JPY</option>
                        <option value="CAD">CAD</option>
                        <option value="AUD">AUD</option>
                    </select>
                </div>
                <p id="amount-error" role="status"></p>
            </div>
        </div>
        <section id="right-section" aria-labelledby="history-heading">
            <div id="currency-graph">
                <h2 id="history-heading">Kur geçmişi</h2>
                <div class="time-selector" role="group" aria-label="Grafik dönemi">
                    <button class="time-btn" type="button" data-range="day" aria-pressed="false">1G</button>
                    <button class="time-btn" type="button" data-range="week" aria-pressed="false">5G</button>
                    <button class="time-btn active" type="button" data-range="month" aria-pressed="true">1A</button>
                    <button class="time-btn" type="button" data-range="year" aria-pressed="false">1Y</button>
                    <button class="time-btn" type="button" data-range="fiveYears" aria-pressed="false">5Y</button>
                    <button class="time-btn" type="button" data-range="max" aria-pressed="false">Maks.</button>
                </div>
                <p id="history-status" role="status"></p>
                <button id="retry-history" type="button" class="utility-btn" hidden>Grafiği yeniden yükle</button>
                <div id="graph" hidden>
                    <canvas id="history-canvas" aria-hidden="true"></canvas>
                    <p id="history-summary"></p>
                    <p id="point-value" aria-live="polite"></p>
                    <label id="point-controls" for="point-picker">
                        Kayıt seç
                        <input id="point-picker" type="range" min="0" max="0" value="0"
                               aria-describedby="point-value">
                    </label>
                </div>
            </div>
        </section>
    </div>
    
    <script src="rates.js"></script>
    <script src="history.js"></script>
    <script src="app.js"></script>
</body>
</html>
