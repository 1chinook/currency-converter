<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Conventer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main-container">
        <div id="left-section">
            <div id="currency-section">
                <h3 id="first-currency">1 Türk Lirası</h3>
                <h1 id="second-currency">0,023 ABD Doları</h1>
                <h4 id="date">22 Şub 06:47 UTC · Sağlayan: Morningstar · Sorumluluk reddi beyanı</h4>
            </div>
            <div id="currency-inputs">
                <input type="text" id="first-currencyInput">
                <input type="text" id="second-currencyInput">
            </div>
        </div>
        <div id="right-section">
            <div id="currency-graph"></div>
        </div>
    </div>
    
</body>
<script src="app.js"></script>
</html>
