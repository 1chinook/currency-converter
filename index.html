<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Conventer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main-container">
        <div id="left-section">
            <div id="currency-section">
                <h3 id="first-currency">1 Türk Lirası</h3>
                <h1 id="second-currency">0,023 ABD Doları</h1>
                <h4 id="date"><span id="now"></span>· Sağlayan: Frankfurter.dev Sorumluluk reddi beyanı</h4>
            </div>
            <div id="currency-inputs">
                <div id="first-currency">
                    <input type="number" id="first-currency-number">
                    <select id="first-currency-option">
                        <option value="EUR">EUR</option>
                        <option value="TRY">TRY</option>
                        <option value="USD">USD</option>
                        <option value="GBP">GBP</option>
                        <option value="JPY">JPY</option>
                        <option value="CAD">CAD</option>
                        <option value="AUD">AUD</option>
                    </select>
                </div>
                <div id="second-currency">
                    <input type="number" id="second-currency-number">
                    <select id="second-currency-option">
                        <option value="EUR">EUR</option>
                        <option value="TRY">TRY</option>
                        <option value="USD">USD</option>
                        <option value="GBP">GBP</option>
                        <option value="JPY">JPY</option>
                        <option value="CAD">CAD</option>
                        <option value="AUD">AUD</option>
                    </select>
                </div>
            </div>
        </div>
        <div id="right-section">
            <div id="currency-graph">
                <div class="time-selector">
                    <button class="time-btn">1G</button>
                    <button class="time-btn">5G</button>
                    <button class="time-btn">1A</button>
                    <button class="time-btn">1Y</button>
                    <button class="time-btn">5Y</button>
                    <button class="time-btn">Maks.</button>
                </div>
                <div id="graph">
                    
                </div>
            </div>
        </div>
    </div>
    
</body>
<script src="app.js"></script>
</html>
