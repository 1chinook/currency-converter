<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main-container">
        <div id="left-section">
            <div id="currency-section">
                <h3 id="first-currency">1 TRY eşittir</h3>
                <h1 id="second-currency" aria-live="polite">—</h1>
                <h4 id="date"><span id="now"></span> · Sağlayan: Frankfurter</h4>
            </div>
            <div id="currency-inputs">
                <div class="currency-field">
                    <input type="number" id="first-currency-number" aria-label="Kaynak tutar" step="any" value="1">
                    <select id="first-currency-option" aria-label="Kaynak para birimi">
                        <option value="EUR">EUR</option>
                        <option value="TRY" selected>TRY</option>
                        <option value="USD">USD</option>
                        <option value="GBP">GBP</option>
                        <option value="JPY">JPY</option>
                        <option value="CAD">CAD</option>
                        <option value="AUD">AUD</option>
                    </select>
                </div>
                <div class="currency-field">
                    <input type="number" id="second-currency-number" aria-label="Çevrilen tutar" readonly>
                    <select id="second-currency-option" aria-label="Hedef para birimi">
                        <option value="EUR">EUR</option>
                        <option value="TRY">TRY</option>
                        <option value="USD" selected>USD</option>
                        <option value="GBP">GBP</option>
                        <option value="JPY">JPY</option>
                        <option value="CAD">CAD</option>
                        <option value="AUD">AUD</option>
                    </select>
                </div>
            </div>
        </div>
        <div id="right-section">
            <div id="currency-graph">
                <div class="time-selector">
                    <button class="time-btn">1G</button>
                    <button class="time-btn">5G</button>
                    <button class="time-btn">1A</button>
                    <button class="time-btn">1Y</button>
                    <button class="time-btn">5Y</button>
                    <button class="time-btn">Maks.</button>
                </div>
                <div id="graph">
                    
                </div>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
